name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ ios-port ]

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja

      - name: Build SDL2 for iOS
        shell: bash
        run: |
          set -euo pipefail
          SDL_VER=2.30.9
          curl -L "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL2-${SDL_VER}.tar.gz" -o sdl.tar.gz
          tar xf sdl.tar.gz
          cmake -S "SDL2-${SDL_VER}" -B build-sdl-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-ios-install" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST=OFF \
            -DSDL_RENDER=OFF \
            -DSDL_OPENGL=OFF \
            -DSDL_OPENGLES=ON \
            -DSDL_VULKAN=OFF \
            -DSDL_METAL=OFF
          cmake --build build-sdl-ios --config Release --parallel 4
          cmake --install build-sdl-ios --config Release

      - name: Configure (CMake + iOS toolchain)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=ios/ios-toolchain.cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$PWD/sdl-ios-install" \
            -DSDL2_DIR="$PWD/sdl-ios-install/lib/cmake/SDL2" \
            -DIOS=ON \
            -DFEATURE_RENDERER_GLES=ON \
            -DFEATURE_RENDERER1=OFF \
            -DFEATURE_RENDERER2=OFF \
            -DBUILD_SERVER=OFF \
            -DBUILD_SERVER_MOD=OFF \
            -DBUILD_CLIENT=ON \
            -DBUILD_CLIENT_MOD=ON \
            -DRENDERER_DYNAMIC=OFF \
            -DFEATURE_IRC_CLIENT=OFF \
            -DFEATURE_IRC_SERVER=OFF \
            -DFEATURE_AUTOUPDATE=OFF \
            -DFEATURE_OPENAL=OFF \
            -DFEATURE_CURL=OFF \
            -DFEATURE_SSL=OFF \
            -DBUNDLED_LIBS=ON \
            -DBUNDLED_SDL=OFF

      - name: Build
        run: cmake --build build-ios --config Release --parallel 4

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build-ios -name '*.app' -type d | /usr/bin/head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found; listing build-ios for debugging"
            find build-ios -maxdepth 4 | /usr/bin/head -n 200
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ETLegacy-iOS-unsigned.ipa Payload
          ls -lah ETLegacy-iOS-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETLegacy-iOS-unsigned
          path: ETLegacy-iOS-unsigned.ipa
